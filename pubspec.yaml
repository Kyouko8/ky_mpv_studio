name: mpv_studio
description: "MPV Studio"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

  # Local path dependency so MPV Studio always tracks the working copy
  # of the engine package sitting next to it, not a pub.dev release.
  mpv_audio_kit:
    path: ../mpv_audio_kit

  file_selector: ^1.0.3
  desktop_drop: ^0.7.1
  shared_preferences: ^2.5.4
  go_router: ^17.2.3
  infinite_scroll_pagination: ^5.1.1

  # Media-server libraries (published by the author) for the Stream page's
  # Jellyfin / Plex tabs.
  dart_jellyfin: 0.0.2
  dart_plex: 0.0.2
  device_info_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
